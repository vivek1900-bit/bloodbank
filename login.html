<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – BloodConnect</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">

  <nav class="navbar">
    <div class="nav-brand">🩸 BloodConnect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🩸</div>
        <h2>Welcome Back</h2>
        <p>Login to your BloodConnect account</p>
      </div>

      <div id="loginMsg" class="msg-box" style="display:none;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn btn-primary full-width">Login</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p><small>Admin? Use email: <strong>admin@blood.com</strong> | password: <strong>admin123</strong></small></p>
      </div>
    </div>
  </div>

  <script>
    // Seed default admin if not exists
    (function seedAdmin() {
      let users = JSON.parse(localStorage.getItem('bb_users') || '[]');
      const adminExists = users.find(u => u.email === 'admin@blood.com');
      if (!adminExists) {
        users.push({
          id: 'admin_1',
          name: 'Admin',
          email: 'admin@blood.com',
          password: 'admin123',
          role: 'admin',
          blood: 'O+',
          phone: '9999999999',
          city: 'HQ'
        });
        localStorage.setItem('bb_users', JSON.stringify(users));
      }
      // Seed inventory if empty
      if (!localStorage.getItem('bb_inventory')) {
        const inv = {
          'A+': 10, 'A-': 5, 'B+': 8, 'B-': 3,
          'AB+': 6, 'AB-': 2, 'O+': 12, 'O-': 4
        };
        localStorage.setItem('bb_inventory', JSON.stringify(inv));
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const users = JSON.parse(localStorage.getItem('bb_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);
      const msgBox = document.getElementById('loginMsg');

      if (!user) {
        msgBox.style.display = 'block';
        msgBox.className = 'msg-box error';
        msgBox.textContent = '❌ Invalid email or password. Please try again.';
        return;
      }

      localStorage.setItem('bb_loggedIn', JSON.stringify(user));
      msgBox.style.display = 'block';
      msgBox.className = 'msg-box success';
      msgBox.textContent = '✅ Login successful! Redirecting...';

      setTimeout(() => {
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'user.html';
        }
      }, 1000);
    });
  </script>
</body>
</html>
