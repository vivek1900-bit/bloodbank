<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – BloodConnect</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">

  <nav class="navbar">
    <div class="nav-brand">🩸 BloodConnect</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="signup.html" class="active">Sign Up</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card wide-card">
      <div class="auth-header">
        <div class="auth-icon">📝</div>
        <h2>Create Account</h2>
        <p>Register as a blood donor</p>
      </div>

      <div id="signupMsg" class="msg-box" style="display:none;"></div>

      <form id="signupForm" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="John Doe" required/>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Min 6 characters" required/>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="Re-enter password" required/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" placeholder="10-digit mobile" required/>
          </div>
          <div class="form-group">
            <label>Blood Group</label>
            <select id="regBlood" required>
              <option value="">-- Select --</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="regAge" placeholder="18–65" min="18" max="65" required/>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="regCity" placeholder="Your city" required/>
          </div>
        </div>

        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const msgBox = document.getElementById('signupMsg');

      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const confirm  = document.getElementById('regConfirm').value.trim();
      const phone    = document.getElementById('regPhone').value.trim();
      const blood    = document.getElementById('regBlood').value;
      const age      = document.getElementById('regAge').value;
      const city     = document.getElementById('regCity').value.trim();

      // Validations
      if (password !== confirm) {
        showMsg('❌ Passwords do not match!', 'error');
        return;
      }
      if (password.length < 6) {
        showMsg('❌ Password must be at least 6 characters!', 'error');
        return;
      }
      if (!/^\d{10}$/.test(phone)) {
        showMsg('❌ Enter a valid 10-digit phone number!', 'error');
        return;
      }

      let users = JSON.parse(localStorage.getItem('bb_users') || '[]');
      if (users.find(u => u.email === email)) {
        showMsg('❌ Email already registered. Please login.', 'error');
        return;
      }

      const newUser = {
        id: 'user_' + Date.now(),
        name, email, password, phone, blood, age, city,
        role: 'user',
        donationHistory: [],
        registeredOn: new Date().toLocaleDateString('en-IN')
      };

      users.push(newUser);
      localStorage.setItem('bb_users', JSON.stringify(users));

      showMsg('✅ Account created successfully! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);

      function showMsg(text, type) {
        msgBox.style.display = 'block';
        msgBox.className = 'msg-box ' + type;
        msgBox.textContent = text;
      }
    });
  </script>
</body>
</html>
